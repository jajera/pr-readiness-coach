name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build web SPA
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: CDK synth
        run: npx cdk synth -q -c enableDynamo=true

  # Optional live diff vs deployed stack. Requires:
  # - repo variable ENABLE_CDK_DIFF=true
  # - secret AWS_ROLE_ARN with OIDC trust that includes this ref
  #   (main-only trust will not work on pull_request — extend trust or use a read-only role)
  cdk-diff:
    if: vars.ENABLE_CDK_DIFF == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure AWS credentials (OIDC)
        run: |
          chmod +x scripts/configure-aws-oidc.sh
          ./scripts/configure-aws-oidc.sh "${{ secrets.AWS_ROLE_ARN }}" "${AWS_REGION}"
      - name: CDK diff
        run: |
          export CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          export CDK_DEFAULT_REGION="${AWS_REGION}"
          npx cdk diff -c enableDynamo=true --fail false
