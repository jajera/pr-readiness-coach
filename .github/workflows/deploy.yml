name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Job 1: API/infra only. Failures here are CDK / CloudFormation — not Amplify.
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d #v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: CDK deploy
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${ACCOUNT}"

          # Mask current stack outputs before CDK prints them (public repo).
          if aws cloudformation describe-stacks --stack-name PrReadinessCoachStack >/dev/null 2>&1; then
            while IFS= read -r val; do
              if [ -n "${val}" ] && [ "${val}" != "None" ]; then
                echo "::add-mask::${val}"
              fi
            done < <(
              aws cloudformation describe-stacks \
                --stack-name PrReadinessCoachStack \
                --query 'Stacks[0].Outputs[].OutputValue' \
                --output text | tr '\t' '\n'
            )
          fi

          export CDK_DEFAULT_ACCOUNT="${ACCOUNT}"
          export CDK_DEFAULT_REGION="${AWS_REGION}"
          # Prefer secret PR_READY_OWNER_EMAIL (repo secret); fall back to Actions variable.
          OWNER_ARGS=()
          OWNER_EMAIL="${{ secrets.PR_READY_OWNER_EMAIL }}"
          if [ -z "${OWNER_EMAIL}" ]; then
            OWNER_EMAIL="${{ vars.PR_READY_OWNER_EMAIL }}"
          fi
          if [ -n "${OWNER_EMAIL}" ]; then
            echo "::add-mask::${OWNER_EMAIL}"
            OWNER_ARGS+=(-c "ownerEmail=${OWNER_EMAIL}")
          fi
          # Redact any new/changed output values CDK still prints (first deploy, URL churn).
          npx cdk deploy --require-approval never -c enableDynamo=true "${OWNER_ARGS[@]}" \
            --outputs-file /tmp/cdk-outputs.json 2>&1 \
            | node dist/ci/redact-deploy-log.js
          rm -f /tmp/cdk-outputs.json

  # Job 2: SPA zip → Amplify (separate so Amplify/build failures are obvious).
  # Caveat: Vite bakes VITE_* at build time — must run after CDK so stack outputs exist.
  # No GitHub↔Amplify connection; manual zip deploy only.
  deploy-amplify:
    name: deploy-amplify
    needs: deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d #v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy SPA to Amplify (zip)
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-amplify.sh
          # Mask AppUrl / Amplify ids before script echoes them
          while IFS= read -r val; do
            if [ -n "${val}" ] && [ "${val}" != "None" ]; then
              echo "::add-mask::${val}"
            fi
          done < <(
            aws cloudformation describe-stacks \
              --stack-name PrReadinessCoachStack \
              --query 'Stacks[0].Outputs[].OutputValue' \
              --output text | tr '\t' '\n'
          )
          ./scripts/deploy-amplify.sh
