<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none" role="img" aria-label="PR Readiness Coach CLI READY report">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#07140f"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#101820"/>
      <stop offset="1" stop-color="#0c1412"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="220" fill="#0f6b4c" fill-opacity="0.18"/>
  <circle cx="180" cy="560" r="180" fill="#14f1c8" fill-opacity="0.06"/>

  <!-- Terminal window -->
  <rect x="90" y="70" width="1020" height="535" rx="16" fill="url(#term)" stroke="#1f3d32" stroke-width="2"/>
  <rect x="90" y="70" width="1020" height="48" rx="16" fill="#15241e"/>
  <rect x="90" y="102" width="1020" height="16" fill="#15241e"/>

  <!-- Traffic lights -->
  <circle cx="124" cy="94" r="7" fill="#ff5f57"/>
  <circle cx="148" cy="94" r="7" fill="#febc2e"/>
  <circle cx="172" cy="94" r="7" fill="#28c840"/>

  <text x="600" y="100" text-anchor="middle" fill="#7d9a8c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">pr-ready --local --path fixtures/demo-app/ready</text>

  <!-- Report body -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="130" y="168" fill="#8fa099" font-size="18">======== PR Readiness Coach ========</text>

    <text x="130" y="214" fill="#e8fff8" font-size="28" font-weight="700">Verdict:</text>
    <text x="280" y="214" fill="#3dd68c" font-size="28" font-weight="700" filter="url(#glow)">READY</text>

    <text x="130" y="258" fill="#9bb5a8" font-size="18">Branch: ready</text>
    <text x="130" y="288" fill="#9bb5a8" font-size="18">Mode: heuristic-only</text>

    <text x="130" y="340" fill="#8fa099" font-size="18">--- Blockers ---</text>
    <text x="130" y="370" fill="#6a8a7c" font-size="17">(none)</text>

    <text x="130" y="418" fill="#8fa099" font-size="18">--- Checklist ---</text>
    <text x="130" y="452" fill="#3dd68c" font-size="17">[x] No secrets or sensitive paths in changes</text>
    <text x="130" y="482" fill="#3dd68c" font-size="17">[x] No TODO/FIXME in added lines</text>
    <text x="130" y="512" fill="#3dd68c" font-size="17">[x] No debug log statements in added lines</text>
    <text x="130" y="542" fill="#3dd68c" font-size="17">[x] Diff within size limit</text>
    <text x="130" y="572" fill="#3dd68c" font-size="17">[x] Source changes accompanied by tests</text>
  </g>
</svg>
